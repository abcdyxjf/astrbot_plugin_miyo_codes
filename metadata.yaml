name: astrbot_plugin_miyo_codes
display_name: 米哈游前瞻兑换码
short_desc: 原神 / 星穹铁道 / 绝区零 前瞻直播兑换码，直播结束当天自动发群或私聊
desc: |
  米哈游三款游戏（原神、崩坏：星穹铁道、绝区零）每次版本前瞻直播都会发兑换码，
  通常第二天就过期。这个插件盯着官方直播接口，等码全部揭晓、直播结束之后再发出来。

  取码走的是米游社直播间页面自己用的公开接口，码是官方原始数据，
  不是从玩家帖子里抄的，所以不会抄错、抄漏或抄到国际服。

  **主要特性**

  - 只在「码全部揭晓 + 直播已结束 + 再等 N 分钟」之后才发，不会发出残缺消息
  - 绝区零这类只发 1 个码的游戏也能正确判断（不写死「至少 3 个」）
  - 支持群发和私聊，按群/人分别去重，新加的群会自动补发当前场次
  - 从官方预告帖自动读开播时间，按预告前后提速轮询（直播不一定在周五晚上）
  - 按版本周期推算下一场前瞻窗口，临近时自动把预告检查从 6 小时缩到 1 小时
  - 自动读游戏内公告拿版本起止日期，星铁可额外用「版本速览」长图 OCR 兜底
  - 星铁可从米游社版区工具列表自动拿到 act_id，全程无需人工介入
  - 原神版区同样能读到工具列表（需带米游社 App 的请求头），按钮一上线即可自动发现
  - 群里有人贴直播间链接就自动接住 act_id，不用改配置
  - 群里说一句「崩铁兑换码」「原神兑换码」「绝区零兑换码」就地把码回出来
  - `/兑码` 强制重发默认只给管理员，避免任何群成员都能触发刷屏

  **需要你做的事**

  星铁：不用管，版区的「直播兑换码」按钮一上线，act_id 就自动到手了。
  原神：多半也不用管 —— 版区工具列表能正常读到（带 App 请求头后 10 项都在），
  只是目前不在前瞻窗口期、这一项还没出现，等下次前瞻确认。
  为了保险，第一次跑原神时建议仍把链接发到群里对一下。
  绝区零：版区工具列表里确实没有这一项，每场前瞻前把直播间链接发到群里，
  或把 `?act_id=` 后面那串填进配置。
